security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        admin_env:
            id: App\Security\EnvAdminUserProvider
        app_users:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/admin
            provider: admin_env
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_inbox
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
        map_admin:
            pattern: ^/maps/[^/]+/admin
            lazy: true
            provider: app_users
            context: map_owner
            entry_point: App\Security\MapAdminEntryPoint
            custom_authenticators:
                - App\Security\MapOwnerAuthenticator
            logout:
                path: map_admin_logout
                target: platform_home
                enable_csrf: true
        main:
            lazy: true
            provider: app_users
            context: map_owner

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/maps/[^/]+/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/maps/[^/]+/admin, roles: ROLE_MAP_OWNER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
