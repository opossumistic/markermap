name: Deploy FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, iconv, mbstring, sqlite3, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        env:
          APP_ENV: prod
          APP_SECRET: ci-build-only-not-used-in-prod

      - name: Compile AssetMapper assets
        run: php bin/console asset-map:compile
        env:
          APP_ENV: prod
          APP_SECRET: ci-build-only-not-used-in-prod
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/ci.db"
          MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
          ADMIN_PASSWORD: unused
          GEOCODER_USER_AGENT: "tauschmap-ci/0.1"
          MIGRATE_TOKEN: unused
          MAILER_DSN: "null://null"
          MESSENGER_TRANSPORT_DSN: "in-memory://"

      - name: Ensure runtime directories exist in artifact
        run: |
          mkdir -p var/cache var/log var/data/backups public/uploads/locations
          touch var/data/.gitkeep public/uploads/locations/.gitkeep

      - name: FTP sync
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ddev/**
            **/.github/**
            **/tests/**
            **/var/cache/**
            **/var/log/**
            **/var/data/**
            **/public/uploads/locations/**
            **/.env.local
            **/.env.*.local
            **/phpunit.xml*
            **/.phpunit.cache/**
            **/tauschbox-hamburg-shared-hosting-konzept.md
            **/agent-transcripts/**
            **/.cursor/**
            **/var/tmp-seed/**
