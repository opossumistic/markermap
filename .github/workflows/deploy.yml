name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_vendor:
        description: 'Upload+unpack vendor.zip even if composer.lock unchanged (needed for first release cutover)'
        type: boolean
        default: false
      bootstrap_shared:
        description: 'Copy legacy .env.local / DB / uploads into shared/ if missing'
        type: boolean
        default: true
      keep_releases:
        description: 'How many releases to keep'
        type: number
        default: 5

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release id
        id: release
        run: |
          RID="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "id=$RID" >> "$GITHUB_OUTPUT"
          echo "Release: $RID"

      - name: Compute composer.lock hash
        id: lock-hash
        run: |
          echo "current_hash=$(sha256sum composer.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore deploy metadata
        uses: actions/cache/restore@v4
        id: deploy-meta
        with:
          path: .deploy-meta
          key: deploy-meta-releases-${{ github.ref_name }}-${{ steps.lock-hash.outputs.current_hash }}

      - name: Check if vendor upload is needed
        id: vendor-check
        run: |
          CURRENT="${{ steps.lock-hash.outputs.current_hash }}"
          CACHE_HIT="${{ steps.deploy-meta.outputs.cache-hit }}"
          FORCE="${{ github.event.inputs.force_vendor || 'false' }}"
          echo "current_hash=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "cache_hit=$CACHE_HIT"
          if [ "$FORCE" = "true" ] || [ "$CACHE_HIT" != "true" ]; then
            echo "deploy_vendor=true" >> "$GITHUB_OUTPUT"
            echo "vendor.zip will be uploaded + unpacked (force=$FORCE cache_hit=$CACHE_HIT)."
          else
            echo "deploy_vendor=false" >> "$GITHUB_OUTPUT"
            echo "composer.lock unchanged — reusing shared/vendor cache (materialized into release on activate)."
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, sqlite3, pdo_sqlite, intl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        env:
          APP_ENV: prod
          APP_SECRET: ci-build-only-not-used-in-prod
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/ci.db"
          MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD: unused
          GEOCODER_USER_AGENT: "tauschmap-ci/0.1"
          MIGRATE_TOKEN: unused
          MAILER_DSN: "null://null"
          MESSENGER_TRANSPORT_DSN: "in-memory://"
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php bin/console asset-map:compile --env=prod

      - name: Ensure runtime directories exist in artifact
        run: |
          mkdir -p var/cache var/tmp public/uploads/locations
          touch var/tmp/.gitkeep

      - name: Pack vendor as zip (single SFTP file)
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        run: |
          set -euo pipefail
          mkdir -p var/tmp
          rm -f var/tmp/vendor-deploy.zip
          (cd vendor && zip -r -q -9 ../var/tmp/vendor-deploy.zip .)
          ls -lh var/tmp/vendor-deploy.zip
          unzip -l var/tmp/vendor-deploy.zip | head -5
          unzip -l var/tmp/vendor-deploy.zip | grep -q 'autoload.php'

      - name: Prepare SFTP excludes and remote mkdir list
        id: rsync
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail

          EXCLUDES=(
            --exclude=.git*
            --exclude=.github
            --exclude=.ddev
            --exclude=.env.local
            --exclude=.env.*.local
            --exclude=docs
            --exclude=tests
            --exclude=vendor
            --exclude=var/cache
            --exclude=var/log
            --exclude=var/data
            --exclude=var/tmp
            --exclude=public/uploads
            --exclude=tauschbox-hamburg-shared-hosting-konzept.md
            --exclude=.deploy-meta
          )
          echo "args=${EXCLUDES[*]}" >> "$GITHUB_OUTPUT"

          RID="$RELEASE_ID"
          FORCE_MKDIR=(
            shared
            shared/var
            shared/var/data
            shared/var/data/backups
            shared/var/log
            shared/var/tmp
            shared/public
            shared/public/uploads
            shared/public/uploads/locations
            shared/vendor
            releases
            "releases/${RID}"
          )

          MKDIR_FILE="${RUNNER_TEMP}/remote-mkdir.txt"
          {
            printf '%s\n' "${FORCE_MKDIR[@]}"
            # App dirs under this release only (depth-sorted).
            find . \( \
              -path './.git' -o -path './.git/*' \
              -o -path './.github' -o -path './.github/*' \
              -o -path './.ddev' -o -path './.ddev/*' \
              -o -path './docs' -o -path './docs/*' \
              -o -path './tests' -o -path './tests/*' \
              -o -path './vendor' -o -path './vendor/*' \
              -o -path './var/cache' -o -path './var/cache/*' \
              -o -path './var/log' -o -path './var/log/*' \
              -o -path './var/data' -o -path './var/data/*' \
              -o -path './var/tmp' -o -path './var/tmp/*' \
              -o -path './public/uploads' -o -path './public/uploads/*' \
              -o -path './.deploy-meta' -o -path './.deploy-meta/*' \
            \) -prune -o -type d -print \
              | sed 's|^\./||' | grep -vx '\.' \
              | while IFS= read -r d; do
                  printf 'releases/%s/%s\n' "$RID" "$d"
                done
            printf 'releases/%s/var\n' "$RID"
            printf 'releases/%s/var/cache\n' "$RID"
            printf 'releases/%s/var/tmp\n' "$RID"
          } | sort -u \
            | awk '{ printf "%04d\t%s\n", gsub(/\//, "/"), $0 }' \
            | sort -n -k1,1 \
            | cut -f2- > "$MKDIR_FILE"

          echo "mkdir_file=${MKDIR_FILE}" >> "$GITHUB_OUTPUT"
          echo "Remote mkdir candidates: $(wc -l < "$MKDIR_FILE")"

      - name: Ensure remote directories exist
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          MKDIR_FILE: ${{ steps.rsync.outputs.mkdir_file }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          REMOTE="${SFTP_REMOTE_PATH%/}"
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}"
            while IFS= read -r d; do
              [ -n "${d}" ] || continue
              echo "-mkdir ${d}"
            done < "${MKDIR_FILE}"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"

      - name: Deploy release tree via SFTP (without vendor/)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          ssh_private_key: ''
          local_path: .
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}/releases/${{ steps.release.outputs.id }}
          sftp_only: true
          rsyncArgs: ${{ steps.rsync.outputs.args }}

      # wlixcc/SFTP-Deploy-Action uploads via `put -r filtered/*` — shell globs skip dotfiles.
      # Committed `.env` (defaults, no secrets) must be put explicitly.
      - name: Upload release .env (dotfile)
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          test -f .env
          REMOTE="${SFTP_REMOTE_PATH%/}"
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}/releases/${RELEASE_ID}"
            echo "put .env .env"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"
          echo "Uploaded .env to releases/${RELEASE_ID}/"

      - name: Bootstrap live _ops scripts (callable before switch)
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${SFTP_REMOTE_PATH%/}"
          # Never mkdir "current" — that would block the symlink switch.
          # 1) Legacy in-place docroot (pre-cutover).
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}"
            echo "-mkdir public"
            echo "-mkdir public/_ops"
            echo "cd ${REMOTE}/public/_ops"
            echo "put public/_ops/_helpers.php _helpers.php"
            echo "put public/_ops/activate-release.php activate-release.php"
            echo "put public/_ops/unpack-vendor.php unpack-vendor.php"
            echo "put public/_ops/ensure-runtime.php ensure-runtime.php"
            echo "put public/_ops/db-status.php db-status.php"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"
          # 2) Post-cutover: update ops inside existing current symlink (old release).
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}/current/public/_ops"
            echo "put public/_ops/_helpers.php _helpers.php"
            echo "put public/_ops/activate-release.php activate-release.php"
            echo "put public/_ops/unpack-vendor.php unpack-vendor.php"
            echo "put public/_ops/ensure-runtime.php ensure-runtime.php"
            echo "put public/_ops/db-status.php db-status.php"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}" \
            && echo "Updated current/public/_ops" \
            || echo "No current symlink yet — legacy public/_ops is enough for first cutover."
          rm -f "$BATCH"

      - name: Upload vendor.zip to shared/var/tmp
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${SFTP_REMOTE_PATH%/}"
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}/shared/var/tmp"
            echo "put var/tmp/vendor-deploy.zip vendor-deploy.zip"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"
          echo "vendor-deploy.zip uploaded to shared/var/tmp."

      - name: Ensure runtime dirs on server
        if: success()
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "OPS_BASE_URL / MIGRATE_TOKEN not set — skip ensure-runtime."
            exit 0
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/ensure-runtime.php"
          HTTP_CODE=$(curl -sS -X POST "${BASE}/_ops/ensure-runtime.php" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 60 \
            -o /tmp/ensure.json \
            -w "%{http_code}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/ensure.json
          echo
          php -r '$j=json_decode(file_get_contents("/tmp/ensure.json"), true); exit(!empty($j["ok"])?0:1);'

      - name: Unpack vendor into shared/vendor
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "::error::OPS_BASE_URL and MIGRATE_TOKEN secrets are required to unpack vendor.zip"
            exit 1
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/unpack-vendor.php"
          HTTP_CODE=$(curl -sS -X POST "${BASE}/_ops/unpack-vendor.php" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 600 \
            -o /tmp/unpack.json \
            -w "%{http_code}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/unpack.json
          echo
          php -r '$j=json_decode(file_get_contents("/tmp/unpack.json"), true); exit(!empty($j["ok"])?0:1);'

      - name: Activate release (symlink shared + switch current)
        if: success()
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          BOOTSTRAP: ${{ github.event.inputs.bootstrap_shared || 'true' }}
          KEEP: ${{ github.event.inputs.keep_releases || '5' }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "::error::OPS_BASE_URL and MIGRATE_TOKEN required to activate release"
            exit 1
          fi
          BASE="${OPS_BASE_URL%/}"
          BOOTSTRAP_FLAG=0
          if [ "$BOOTSTRAP" = "true" ]; then BOOTSTRAP_FLAG=1; fi
          echo "POST ${BASE}/_ops/activate-release.php release=${RELEASE_ID}"
          HTTP_CODE=$(curl -sS -X POST "${BASE}/_ops/activate-release.php" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "release=${RELEASE_ID}&keep=${KEEP}&bootstrap_shared=${BOOTSTRAP_FLAG}" \
            --max-time 120 \
            -o /tmp/activate.json \
            -w "%{http_code}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/activate.json
          echo
          php -r '$j=json_decode(file_get_contents("/tmp/activate.json"), true); exit(!empty($j["ok"])?0:1);'

      - name: Run migrations on server
        if: success()
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "OPS_BASE_URL / MIGRATE_TOKEN not set — skip remote migrate (run manually)."
            exit 0
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/migrate"
          curl -fsS -X POST "${BASE}/_ops/migrate" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 120 \
            -o /tmp/migrate.json || {
              echo "::warning::migrate call failed (site may still be fine if no new migrations)"
              cat /tmp/migrate.json 2>/dev/null || true
              exit 0
            }
          cat /tmp/migrate.json

      - name: Remember deployed composer.lock hash
        if: success()
        run: |
          mkdir -p .deploy-meta
          echo "${{ steps.vendor-check.outputs.current_hash }}" > .deploy-meta/composer.lock.sha

      - name: Save deploy metadata
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .deploy-meta
          key: deploy-meta-releases-${{ github.ref_name }}-${{ steps.lock-hash.outputs.current_hash }}
