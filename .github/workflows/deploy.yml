name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute composer.lock hash
        id: lock-hash
        run: |
          echo "current_hash=$(sha256sum composer.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore deploy metadata
        uses: actions/cache/restore@v4
        id: deploy-meta
        with:
          path: .deploy-meta
          key: deploy-meta-${{ github.ref_name }}-${{ steps.lock-hash.outputs.current_hash }}

      - name: Check if vendor upload is needed
        id: vendor-check
        run: |
          CURRENT="${{ steps.lock-hash.outputs.current_hash }}"
          CACHE_HIT="${{ steps.deploy-meta.outputs.cache-hit }}"
          echo "current_hash=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "cache_hit=$CACHE_HIT"
          # Exact cache key includes composer.lock hash — hit means this lock was deployed successfully before.
          if [ "$CACHE_HIT" = "true" ]; then
            echo "deploy_vendor=false" >> "$GITHUB_OUTPUT"
            echo "composer.lock unchanged — skipping vendor package."
          else
            echo "deploy_vendor=true" >> "$GITHUB_OUTPUT"
            echo "composer.lock changed or no deploy cache — vendor.zip will be uploaded + unpacked."
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, sqlite3, pdo_sqlite, intl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        env:
          APP_ENV: prod
          APP_SECRET: ci-build-only-not-used-in-prod
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/ci.db"
          MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD: unused
          GEOCODER_USER_AGENT: "tauschmap-ci/0.1"
          MIGRATE_TOKEN: unused
          MAILER_DSN: "null://null"
          MESSENGER_TRANSPORT_DSN: "in-memory://"
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          php bin/console asset-map:compile --env=prod

      - name: Ensure runtime directories exist in artifact
        run: |
          mkdir -p var/cache var/log var/data/backups var/tmp public/uploads/locations
          touch var/data/.gitkeep public/uploads/locations/.gitkeep var/tmp/.gitkeep

      - name: Pack vendor as zip (single SFTP file)
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        run: |
          set -euo pipefail
          rm -f var/tmp/vendor-deploy.zip
          # Zip root = vendor contents (autoload.php at archive root).
          (cd vendor && zip -r -q -9 ../var/tmp/vendor-deploy.zip .)
          ls -lh var/tmp/vendor-deploy.zip
          # Sanity
          unzip -l var/tmp/vendor-deploy.zip | head -5
          unzip -l var/tmp/vendor-deploy.zip | grep -q 'autoload.php'

      # Tree-sync excludes + remote mkdir list share one policy:
      # - never-on-server: no sync, no mkdir (docs, tests, .git, …)
      # - sync-excluded shells: no tree sync, but mkdir (vendor zip, var/*, uploads)
      # - everything else: mkdir from checkout (depth-sorted), then sync
      # public/vendor/ (MapLibre) stays in the normal sync; composer vendor/ is zip-only.
      - name: Prepare SFTP excludes and remote mkdir list
        id: rsync
        run: |
          set -euo pipefail

          EXCLUDES=(
            --exclude=.git*
            --exclude=.github
            --exclude=.ddev
            --exclude=.env*
            --exclude=docs
            --exclude=tests
            --exclude=vendor
            --exclude=var/cache
            --exclude=var/log
            --exclude=var/data
            --exclude=var/tmp
            --exclude=public/uploads/locations
            --exclude=tauschbox-hamburg-shared-hosting-konzept.md
          )
          echo "args=${EXCLUDES[*]}" >> "$GITHUB_OUTPUT"

          # Must exist on remote even though content is not tree-synced.
          FORCE_MKDIR=(
            var
            var/cache
            var/log
            var/data
            var/data/backups
            var/tmp
            vendor
            public/uploads
            public/uploads/locations
          )

          MKDIR_FILE="${RUNNER_TEMP}/remote-mkdir.txt"
          {
            # Prune never-on-server + sync-excluded trees (vendor alone is huge after composer install).
            find . \( \
              -path './.git' -o -path './.git/*' \
              -o -path './.github' -o -path './.github/*' \
              -o -path './.ddev' -o -path './.ddev/*' \
              -o -path './docs' -o -path './docs/*' \
              -o -path './tests' -o -path './tests/*' \
              -o -path './vendor' -o -path './vendor/*' \
              -o -path './var/cache' -o -path './var/cache/*' \
              -o -path './var/log' -o -path './var/log/*' \
              -o -path './var/data' -o -path './var/data/*' \
              -o -path './var/tmp' -o -path './var/tmp/*' \
              -o -path './public/uploads/locations' -o -path './public/uploads/locations/*' \
            \) -prune -o -type d -print \
              | sed 's|^\./||' | grep -vx '\.'
            printf '%s\n' "${FORCE_MKDIR[@]}"
          } | sort -u \
            | awk '{ printf "%04d\t%s\n", gsub(/\//, "/"), $0 }' \
            | sort -n -k1,1 \
            | cut -f2- > "$MKDIR_FILE"

          echo "mkdir_file=${MKDIR_FILE}" >> "$GITHUB_OUTPUT"
          echo "Remote mkdir candidates: $(wc -l < "$MKDIR_FILE")"

      # Host allows SFTP only (no SSH exec).
      - name: Ensure remote directories exist
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          MKDIR_FILE: ${{ steps.rsync.outputs.mkdir_file }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          REMOTE="${SFTP_REMOTE_PATH%/}"
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}"
            while IFS= read -r d; do
              [ -n "${d}" ] || continue
              echo "-mkdir ${d}"
            done < "${MKDIR_FILE}"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"

      - name: Deploy app via SFTP (without vendor/)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          ssh_private_key: ''
          local_path: .
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          rsyncArgs: ${{ steps.rsync.outputs.args }}

      - name: Upload vendor.zip via SFTP
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${SFTP_REMOTE_PATH%/}"
          BATCH="$(mktemp)"
          {
            echo "cd ${REMOTE}/var/tmp"
            echo "put var/tmp/vendor-deploy.zip vendor-deploy.zip"
          } > "$BATCH"
          sshpass -e sftp -oBatchMode=no -b "$BATCH" -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=no \
            "${SFTP_USERNAME}@${SFTP_HOST}"
          rm -f "$BATCH"
          echo "vendor-deploy.zip uploaded."

      - name: Unpack vendor on server
        if: steps.vendor-check.outputs.deploy_vendor == 'true'
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "::error::OPS_BASE_URL and MIGRATE_TOKEN secrets are required to unpack vendor.zip"
            exit 1
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/unpack-vendor.php"
          curl -fsS -X POST "${BASE}/_ops/unpack-vendor.php" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 600 \
            -o /tmp/unpack.json
          cat /tmp/unpack.json
          php -r '$j=json_decode(file_get_contents("/tmp/unpack.json"), true); exit(!empty($j["ok"])?0:1);'

      - name: Ensure runtime dirs on server
        if: success()
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "OPS_BASE_URL / MIGRATE_TOKEN not set — skip ensure-runtime."
            exit 0
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/ensure-runtime.php"
          curl -fsS -X POST "${BASE}/_ops/ensure-runtime.php" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 60 \
            -o /tmp/ensure.json
          cat /tmp/ensure.json
          php -r '$j=json_decode(file_get_contents("/tmp/ensure.json"), true); exit(!empty($j["ok"])?0:1);'

      - name: Run migrations on server
        if: success()
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          MIGRATE_TOKEN: ${{ secrets.MIGRATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_BASE_URL:-}" ] || [ -z "${MIGRATE_TOKEN:-}" ]; then
            echo "OPS_BASE_URL / MIGRATE_TOKEN not set — skip remote migrate (run manually)."
            exit 0
          fi
          BASE="${OPS_BASE_URL%/}"
          echo "POST ${BASE}/_ops/migrate"
          curl -fsS -X POST "${BASE}/_ops/migrate" \
            -H "X-Migrate-Token: ${MIGRATE_TOKEN}" \
            -H "Accept: application/json" \
            --max-time 120 \
            -o /tmp/migrate.json || {
              echo "::warning::migrate call failed (site may still be fine if no new migrations)"
              cat /tmp/migrate.json 2>/dev/null || true
              exit 0
            }
          cat /tmp/migrate.json

      - name: Remember deployed composer.lock hash
        if: success()
        run: |
          mkdir -p .deploy-meta
          echo "${{ steps.vendor-check.outputs.current_hash }}" > .deploy-meta/composer.lock.sha

      - name: Save deploy metadata
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .deploy-meta
          key: deploy-meta-${{ github.ref_name }}-${{ steps.lock-hash.outputs.current_hash }}
